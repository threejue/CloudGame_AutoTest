device:
  port: 'COM3'
  baud: 115200
  timeout: 1

paths:
  log_csv: 'reports/device_memory_log.csv'
  chart_png: 'reports/memory_chart.png'

sampling:
  count: 20          # 采样次数
  interval_sec: 5    # 每次间隔（秒）

thresholds:
  min_free_memory_kb: 15000
  max_cpu_temp: 75

boot:
  game_dir: '/your_game_path'   # TODO: 改为真实游戏目录
  game_bin: 'AnyGame'            # 游戏可执行文件名