# 设备后端选择：linux(嵌入式 Linux 串口/pyserial) 或 android(网络 ADB)
platform: 'linux'

device:
  port: 'COM3'
  baud: 115200
  timeout: 2          # 单条命令读取的总超时（秒），防止设备无响应时死等
  read_idle_sec: 0.4  # 串口静默多久（秒）认为本条命令输出结束

paths:
  # run.py 每次运行会创建 reports/run_<时间戳>/ 子目录，以下为其中的文件名
  log_csv: 'device_memory_log.csv'
  chart_png: 'memory_chart.png'

sampling:
  interval_sec: 5    # 每次采样间隔（秒）
  manual_stop: true  # true=持续采样直到手动按 Ctrl+C 结束；false=采样 max_samples 次后自动结束
  max_samples: 0     # 采样次数安全上限：0=不限（仅手动结束）；无人值守时可设 >0 自动停

thresholds:
  min_free_memory_kb: 5000
  max_cpu_temp: 75

boot:
  game_dir: '/your_game_path'   # TODO: 改为真实游戏目录
  game_bin: 'AnyGame'            # 游戏可执行文件名

android:
  host: '192.168.110.21'         # 安卓设备 IP（需设备端开启网络 ADB 调试）
  port: 5050                     # adb tcpip 端口
  adb_path: 'adb'                # adb 可执行文件（PATH 中或写绝对路径）
  # 稳定性测试参数
  boot_stability:
    reboot_count: 3            # 重启次数
    boot_timeout_sec: 180      # 每次重启后等待上线的超时
  resource_stability:
    sample_count: 20           # 采样次数
    sample_interval_sec: 5     # 采样间隔
    min_available_mem_kb: 200000  # 可用内存下限（KB）
    max_cpu_usage: 95          # CPU 使用率上限（%）
  # 压力测试参数
  stress:
    cpu_duration_sec: 30       # CPU 压力持续时间
    mem_size_mb: 200           # 内存压力占用大小（MB）
    mem_duration_sec: 30       # 内存压力持续时间
    sample_interval_sec: 2     # 压力期间采样间隔
    max_temp: 50               # 温度上限（°C）
    min_available_mem_kb: 100000  # 压力期间可用内存下限（KB）
  # 画面监控参数
  monitor:
    target_package: ''         # 要监控的应用包名（留空则不采集帧延迟/FPS 明细）
    duration_sec: 60           # 监控总时长
    sample_interval_sec: 2     # 采样间隔
    min_fps: 20                # 帧率下限（FPS）
    max_latency_p95_ms: 100    # 帧延迟 p95 上限（ms）
    max_total_drops: 50        # 监控期间总丢包上限（个）