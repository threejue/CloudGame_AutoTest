[pytest]
markers =
    manual: 需人工介入的用例（如拔插电源），默认被 run.py 以 -m "not manual" 排除
    integration: 需真机/外部设备的集成测试（如网络 ADB 安卓设备），默认被 run.py 排除，用 -m integration 显式运行

# 让用例中的 logging 输出实时可见（等价于 -s 场景下的 print 效果）
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
